workshops:
  heading: { cs: Dílny a semináře, en: Workshops and seminars }
  format:
    cs:
      - >-
        Semináře jsou určeny účastníkům festivalu a probíhají každé dopoledne v Základní umělecké
        škole Ostrov. Vedoucí souborů se scházejí v rozborovém semináři nad zhlédnutými inscenacemi;
        pro mladé herce je připraveno sedm seminářů, které rozvíjejí dovednosti využitelné v divadle.
      - >-
        Předposlední den festivalu semináře představí výsledky své práce ostatním účastníkům.
    en:
      - >-
        The seminars are for festival participants and take place every morning at Základní
        umělecká škola Ostrov. Group leaders meet in the analysis seminar to discuss the productions
        seen; young actors choose from seven seminars that develop skills for the stage.
      - >-
        On the penultimate day of the festival the seminars present their work to the other
        participants.
