about:
  heading: { cs: O festivalu, en: About the festival }
  description:
    cs:
      - >-
        Soukání Ostrov je mezinárodní divadelní festival dětí a mládeže, který jako bienále pořádá
        Základní umělecká škola Ostrov. Hlásí se na něj prostřednictvím světové organizace
        amatérského divadla AITA/IATA divadelní soubory mladých lidí z celého světa.
      - >-
        Soubory na festival vybírá umělecká komise na základě přihlášek a zaslaných videozáznamů
        inscenací. Souběžně s představeními probíhají odborné semináře: rozborový seminář pro
        vedoucí souborů a semináře pro mladé herce, které rozvíjejí dovednosti využitelné v divadle.
      - >-
        Festival má svou nezapomenutelnou atmosféru díky tomu, že je možné vše vidět, o všem
        diskutovat a vyměňovat si zkušenosti i inscenační postupy. K tomu patří doprovodný program:
        výlet po Karlovarském kraji, společný průvod městem, stánky jednotlivých zemí, akce Soubor
        baví soubor a ochutnávky regionálních dobrot.
      - >-
        Semináře probíhají dopoledne, představení odpoledne a večer je připraven doprovodný program.
        Předposlední den festivalu patří prezentacím seminářů, průvodu městem a stánkům zemí.
    en:
      - >-
        Soukání Ostrov is a biennial international theatre festival of children and youth organized
        by Základní umělecká škola Ostrov, the Ostrov school of arts. Youth theatre groups from all
        over the world apply through AITA/IATA, the world organization of amateur theatre.
      - >-
        Groups are selected by the festival's artistic committee from the applications and the
        videos of their productions. Alongside the performances the festival runs seminars: an
        analysis seminar for group leaders and seminars for young actors that develop skills for
        the stage.
      - >-
        The festival is known for its atmosphere: everyone can see every production, discuss it
        and share experience and working methods. The side programme adds a trip around the
        Karlovy Vary region, a parade through the town, country stands, the "Group entertains
        group" evening and a tasting of regional food.
      - >-
        Seminars take place in the mornings, performances in the afternoons, and the evenings
        belong to the side programme. The penultimate day is reserved for seminar presentations,
        the parade and the country stands.
  nameHeading: { cs: Odkud je název Soukání, en: Where the name comes from }
  nameOrigin:
    cs:
      - >-
        Název festivalu pochází z inscenace o malém pavoučkovi, který k sobě „soukal“ své kamarády
        nitkami. Soubor HOP-HOP ji zahrál při prvním, ještě neformálním setkání s divadelním
        souborem z italského Brixenu kolem roku 1995. Z tohoto setkání vyrostl festival, který se
        od té doby koná jako bienále.
    en:
      - >-
        The festival is named after a production about a little spider who pulled ("soukal" in
        Czech) his friends to himself with threads. The HOP-HOP ensemble performed it at the first,
        still informal meeting with a theatre group from Brixen (Bressanone) in Italy around 1995.
        The festival grew out of that meeting and has been held every two years since.
  countriesHeading: { cs: Kdo už na Soukání hrál, en: Who has performed at Soukání }
  countries:
    cs: >-
      Na festivalu se za jeho historii představily soubory například z Itálie, Slovenska, Litvy,
      Estonska, Jižní Koreje a řady dalších zemí Evropy i světa spolu s domácími soubory
      z České republiky.
    en: >-
      Over the years the festival has hosted groups from Italy, Slovakia, Lithuania, Estonia,
      South Korea and many other countries in Europe and beyond, alongside Czech ensembles.
  venuesHeading: { cs: Kde se festival koná, en: Venues }
  venues:
    cs:
      - "Představení: Kulturní a kreativní centrum Ostrov (Dům kultury Ostrov), Mírové nám. 733"
      - "Semináře: Základní umělecká škola Ostrov, Masarykova 717"
      - "Doprovodný program: město Ostrov a výlet po Karlovarském kraji"
    en:
      - "Performances: Kulturní a kreativní centrum Ostrov (the Ostrov house of culture), Mírové nám. 733"
      - "Seminars: Základní umělecká škola Ostrov, Masarykova 717"
      - "Side programme: the town of Ostrov and a trip around the Karlovy Vary region"
  schoolsHeading: { cs: Festival a ostrovské školy, en: The festival and Ostrov schools }
  schools:
    cs:
      - >-
        Do festivalu se zapojují mladí lidé z ostrovských škol. V rámci výuky jazyků navštěvují
        inscenace zahraničních souborů. Před představením je pro zájemce ze škol připraven seminář
        „Než půjdeme do divadla“, ve kterém se mladí diváci s pedagogy dramatu připravují na
        inscenaci, kterou vzápětí zhlédnou.
    en:
      - >-
        Young people from Ostrov schools take part in the festival: as part of their language
        classes they attend the performances of the foreign groups. Before a performance, the
        seminar "Než půjdeme do divadla" ("Before we go to the theatre") prepares
        the young audience for the production they are about to see, together with drama teachers.
call:
  heading: { cs: Výzva k přihlášení, en: Call for applications }
  intro:
    cs: >-
      Zveme divadelní soubory mladých lidí z celého světa, aby se přihlásily na {n} ročník
      festivalu Soukání Ostrov. Soubory vybírá umělecká komise festivalu na základě přihlášky
      a videozáznamu inscenace.
    en: >-
      We invite youth theatre groups from all over the world to apply for the {n} edition of
      Soukání Ostrov. Groups are selected by the festival's artistic committee on the basis of
      the application and a video of the production.
  conditionsHeading: { cs: Podmínky účasti, en: Conditions }
  conditions:
    cs:
      - "Herci ve věku {ageMin}–{ageMax} let."
      - "Inscenace v délce do {maxMinutes} minut."
      - "Soubor tvoří nejvýše {maxActors} herců a {adultsMin}–{adultsMax} dospělí (režisér, technik, překladatel); při příjezdu vlastním autobusem se počítá i s řidičem."
      - "Pořadatel hradí ubytování a stravu pro {hosted} osob ({maxActors} herců a {adultsMax} dospělé) po dobu festivalu."
      - "Soubory přilétající ze vzdálenějších zemí mohou přijet o den dříve."
      - "Přihláška se podává online formulářem spolu s videozáznamem inscenace."
    en:
      - "Actors aged {ageMin}–{ageMax}."
      - "Productions up to {maxMinutes} minutes long."
      - "A group consists of up to {maxActors} actors and {adultsMin}–{adultsMax} accompanying adults (director, technician, interpreter); a driver is also counted when the group arrives by its own coach."
      - "The organizer covers board and lodging for {hosted} people ({maxActors} actors and {adultsMax} adults) during the festival days."
      - "Groups flying in from more distant countries may arrive one day early."
      - "Applications are submitted through an online form together with a video of the production."
