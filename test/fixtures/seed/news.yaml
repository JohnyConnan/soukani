  title:
    cs: Výzva k přihlášení na Soukání Ostrov 2027
    en: Call for applications – Soukání Ostrov 2027
  text:
    cs: >-
      Zveme divadelní soubory mladých lidí ve věku 14–18 let z celého světa, aby se přihlásily
      na 16. ročník festivalu. Přihlášky s videozáznamem inscenace přijímáme do konce prosince 2026.
    en: >-
      We invite theatre groups of young people aged 14–18 from all over the world to apply
      for the 16th edition of the festival. Applications with a video of the production are
      accepted until the end of December 2026.
