name: Build and deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a running deploy; only the newest queued run waits (GitHub's Pages starter pattern).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check repository variables
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$PATH_PREFIX" ]; then
            echo "Set the SITE_URL and PATH_PREFIX repository variables (Settings → Secrets and variables → Actions → Variables). See README.md › First-time setup."
            exit 1
          fi
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
          SITE_URL: ${{ vars.SITE_URL }}
      - name: Build site
        run: npm run build
        env:
          PATH_PREFIX: ${{ vars.PATH_PREFIX }}
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
